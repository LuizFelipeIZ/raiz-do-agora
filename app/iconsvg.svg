  <!-- Fumaça cheirosa do café subindo -->
  <path d="M35,18 Q40,24 33,29" fill="none" stroke="#FDFBF7" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M45,14 Q50,20 43,25" fill="none" stroke="#FDFBF7" stroke-width="3.5" stroke-linecap="round"/>
